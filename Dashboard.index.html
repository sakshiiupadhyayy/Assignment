<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #eef1f8;
            color: #17233d;
            padding: 15px;
        }

     .dashboard {
            display: grid;
            grid-template-columns: 150px 1fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

         .header {
            grid-area: head;
            background-color: #12203b;
            color: white;
            padding: 20px;
            min-height: 115px;
            border-radius: 8px;
        }

        .header h2 {
            font-size: 22px;
        }

        .sidebar {
            grid-area: side;
            background-color: #dce6fc;
            padding: 15px;
            border-radius: 8px;
        }

        .sidebar h3 {
            margin-bottom: 8px;
        }

        .sidebar ul {
            padding-left: 15px;
        }

        .sidebar li {
            margin-bottom: 8px;
        }

        .sidebar a {
            color: #17233d;
            text-decoration: none;
        }

        .main {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(150px, 1fr)
            );
            gap: 10px;
            align-content: start;
        }

         .card {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            min-height: 60px;
        }

        .icon {
            font-size: 25px;
        }

        .card p {
            font-size: 14px;
        }

        .card strong {
            font-size: 14px;
        }

      .footer {
            grid-area: foot;
            background-color: #12203b;
            color: white;
            text-align: center;
            padding: 15px;
            min-height: 100px;
            border-radius: 8px;
        }

       @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }

            .sidebar {
                padding: 12px;
            }

            .main {
                grid-template-columns:
                    repeat(auto-fit, minmax(130px, 1fr));
            }

            .header {
                min-height: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

       <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#reports">Reports</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </aside>

         <main class="main" id="home">

            <div class="card">
                <span class="icon">👤</span>
                <div>
                    <strong>120</strong>
                    <p>Users</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <div>
                    <strong>Rs 45k</strong>
                    <p>Sales</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">📦</span>
                <div>
                    <strong>36</strong>
                    <p>Orders</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">⭐</span>
                <div>
                    <strong>4.8</strong>
                    <p>Rating</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💬</span>
                <div>
                    <strong>18</strong>
                    <p>Messages</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">✅</span>
                <div>
                    <strong>92%</strong>
                    <p>Done</p>
                </div>
            </div>

        </main>
        <footer class="footer">
            <p>Made with CSS Grid</p>
        </footer>

    </div>

</body>
</html>
