<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #17233d;
        }

   
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #12203b;
            color: white;
            padding: 15px 5%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-right a {
            color: white;
            text-decoration: none;
        }

        button {
            background-color: #ffb900;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

  
        .banner {
            background-color: #315bea;
            color: white;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            gap: 14px;
        }

        .banner h1 {
            font-size: 32px;
        }

    
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 24px 5%;
        }

        .card {
            flex: 1 1 200px;
            background-color: #eef1ff;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 5px;
        }

      
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-right {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .banner h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

  
    <nav class="navbar">
        <div class="logo">CodeLab</div>

        <div class="nav-right">
            <a href="#home">Home</a>
            <a href="#courses">Courses</a>
            <a href="#contact">Contact</a>
            <button>Sign up</button>
        </div>
    </nav>
    <section class="banner" id="home">
        <h1>Learn Web Development</h1>
        <p>Start from zero. Build real projects.</p>
        <button>Get started</button>
    </section>
    <section class="cards" id="courses">

        <div class="card">
            <h3>HTML</h3>
            <p>Build the structure</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Make it beautiful</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Make it smart</p>
        </div>

        <div class="card">
            <h3>Git</h3>
            <p>Save your work</p>
        </div>

    </section>

</body>
</html>
