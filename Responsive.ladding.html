<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase - Responsive Landing Page</title>

    <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #17233d;
            font-size: 1rem;
            background: #ffffff;
        }

      .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #12203b;
            color: white;
            padding: 15px 5%;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 18px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .page {
            display: grid;
            grid-template-columns: 1fr;
        }

       .hero {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            text-align: center;
            gap: 12px;
            background: #315bea;
            color: white;
            padding: 30px 16px;
        }

        .hero h1 {
            font-size: 1.8rem;
        }

        .hero p {
            font-size: 0.95rem;
        }

        .hero img {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 8px;
        }

     .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 24px 5%;
        }

        .feature {
            background: #eef1ff;
            padding: 22px 15px;
            border-radius: 10px;
            text-align: center;
        }

        .feature h2 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .feature p {
            font-size: 0.9rem;
        }

         @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
            }

            .hero {
                padding: 40px 24px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
            }
        }

         @media (min-width: 1024px) {
            .navbar {
                padding: 15px 6%;
            }

            .hero {
                padding: 45px 20px;
            }

            .hero img {
                max-width: 540px;
            }

            .features {
                grid-template-columns: repeat(3, 1fr);
                max-width: 1100px;
                width: 100%;
                margin: auto;
            }
        }
    </style>
</head>

<body>

     <header class="navbar">
        <div class="logo">TravelEase</div>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#trips">Trips</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

      <main class="page">

         <section class="hero" id="home">
            <h1>Plan your next trip in minutes</h1>
            <p>Simple, cheap and fun travel plans.</p>

            <img
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=80"
                alt="Beautiful mountains and a travel destination">
        </section>

        <section class="features" id="trips">

            <article class="feature">
                <h2>Easy Booking</h2>
                <p>Book in 3 clicks.</p>
            </article>

            <article class="feature">
                <h2>Best Prices</h2>
                <p>We compare for you.</p>
            </article>

            <article class="feature" id="contact">
                <h2>24x7 Help</h2>
                <p>We are here for you.</p>
            </article>

        </section>

    </main>

</body>
</html>
