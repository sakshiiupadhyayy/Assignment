<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the Coding Club">
    <title>Coding Club - Register</title>
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>

    <header>
        <h1>Coding Club Registration</h1>
        <nav>
            <a href="event.index.html">Home</a> |
            <a href="event.about.html">About</a> |
            <a href="event.register.html">Register</a> |
            <a href="event.contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Student Registration Form</h2>

        <form action="#" method="get">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Your name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password"
                   name="password" required>
            <br><br>

            <label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Phone number">
            <br><br>

            <span>Gender:</span>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <br><br>

            <span>Interests:</span>
            <input type="checkbox" id="web" name="interest" value="Web">
            <label for="web">Web Development</label>

            <input type="checkbox" id="dsa" name="interest" value="DSA">
            <label for="dsa">DSA</label>
            <br><br>

            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="BCA">BCA</option>
                <option value="BTech">B.Tech</option>
                <option value="BSc">B.Sc</option>
                <option value="MCA">MCA</option>
            </select>
            <br><br>

            <label for="message">Why do you want to join?</label>
            <br>
            <textarea id="message" name="message"
                      rows="5" cols="35"
                      placeholder="Write your message here"></textarea>
            <br><br>

            <button type="submit">Submit Registration</button>
            <button type="reset">Reset</button>

        </form>
    </main>

    <footer>
        <p> 2026 Coding Club</p>
    </footer>

</body>
</html>
